id: roleagent
name: "RoleAgent"
name_zh: "RoleAgent"
name_en: "RoleAgent"
url: "https://openreview.net/forum?id=hORTHzt2cE"
paper: "https://openreview.net/forum?id=hORTHzt2cE"
description_zh: "RoleAgent 关注高质量角色代理的构建、交互与评测。页面主榜单采用英文设置下的 General Response WR-H。"
description_en: "RoleAgent benchmarks the building and interaction quality of role-playing agents. This page uses General Response WR-H on the English setting as the primary leaderboard."
overview_zh: |
  RoleAgent 试图从原始剧本中自动构建高质量角色代理，减少人工编写角色档案的成本。
  在构建阶段，论文通过脚本解析与层级记忆系统，提炼角色的结构化信息和高层记忆。
  在交互阶段，它使用查询拆解、记忆检索、记忆总结和响应生成来提升对话质量。
  论文还提出了 RoleAgentBench，用于系统评测角色自我认知、反应、通用回复与总结能力。
  核心贡献在于把“从剧本自动生成可交互角色”与“可验证评测”结合起来。
overview_en: |
  RoleAgent aims to automatically build high-quality role-playing agents from raw scripts without manual profile creation.
  In the building stage, it parses scripts and constructs a hierarchical memory system for each role.
  In the interaction stage, it improves conversations through query decomposition, memory retrieval, summarization, and response generation.
  The paper also introduces RoleAgentBench to evaluate self-knowledge, reaction, general response, and summarization ability.
  Its core contribution is combining scalable script-based role construction with a systematic evaluation benchmark.
