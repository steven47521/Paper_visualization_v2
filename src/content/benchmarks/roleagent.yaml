highlights_zh:
  - "论文没有单一统一总分，因此页面选择最贴近用户体验的人评胜率作为主榜单。"
  - "同时保留 self-knowledge 与 reaction，有助于理解角色代理的能力结构。"
highlights_en:
  - "The paper does not report one unified overall score, so the page uses the most user-facing human win rate as the primary leaderboard."
  - "Self-knowledge and reaction are also preserved to reflect the structure of role-agent ability."
leaderboard_note_zh: "主榜单使用英文评测子集的 General Response WR-H。由于论文强调多维角色代理能力，这里同步保留若干辅助指标。"
leaderboard_note_en: "The primary leaderboard uses General Response WR-H from the English evaluation subset. Since the paper emphasizes multi-dimensional role-agent ability, a few auxiliary metrics are kept as well."
