id: iv_bench
name: "IV-Bench"
name_zh: "IV-Bench"
name_en: "IV-Bench"
url: "https://github.com/multimodal-art-projection/IV-Bench"
paper: "https://arxiv.org/abs/2504.15415"
description_zh: "IV-Bench 评测图像支撑视频理解与推理能力，要求模型同时整合图像和视频证据。页面主榜单采用论文主表中的 Overall。"
description_en: "IV-Bench evaluates image-grounded video perception and reasoning. This page uses the Overall score from the main table."
overview_zh: "这篇工作强调某些视频理解任务不能只依赖视频流本身，还需要结合配套图像才能完成推理。\nIV-Bench 覆盖感知与推理两大类能力，用图像必要性来提升任务难度与真实性。\n结果显示，强模型在整体上仍有明显上限，说明图像支撑的视频推理仍是一个独立且困难的方向。"
overview_en: "This work argues that some video-understanding tasks require supporting images in addition to the video stream itself.\nIV-Bench covers both perception and reasoning, and uses image necessity to make the tasks more realistic and challenging.\nThe results show substantial headroom even for strong models, indicating that image-grounded video reasoning remains difficult."
