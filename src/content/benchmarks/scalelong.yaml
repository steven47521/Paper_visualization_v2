id: scalelong
name: "ScaleLong"
name_zh: "ScaleLong"
name_en: "ScaleLong"
url: "https://github.com/multimodal-art-projection/ScaleLong"
paper: "https://arxiv.org/abs/2505.23922"
description_zh: "ScaleLong 面向长视频理解，强调多时间尺度下的细粒度视频推理。页面主榜单采用主结果表中的 Overall。"
description_en: "ScaleLong targets long-video understanding with multi-timescale reasoning. This page uses the Overall score from the main result table."
overview_zh: "这篇工作把长视频理解拆分到 clip、shot、event 和 story 等不同时间尺度上，并覆盖多种任务类型。\n论文强调模型不仅要看见局部片段，还要能在长时间跨度内整合事件与叙事信息。\n主结果显示，闭源模型在整体上更强，但长视频理解仍然是高难问题，尤其在故事级推理上差距明显。"
overview_en: "This work decomposes long-video understanding into multiple timescales such as clip, shot, event, and story, while covering diverse task types.\nIt emphasizes that models must not only perceive local clips, but also integrate events and narratives over long horizons.\nThe main results show stronger overall performance for leading closed-source models, yet long-video reasoning remains difficult, especially at the story level."
glance:
