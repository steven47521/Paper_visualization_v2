highlights_zh:
  - "该工作不是单一编程题，而是更贴近完整产品开发流程的综合评测。"
  - "前端页面保留 Overall 作为主榜单，避免把领域子项拆得过细。"
highlights_en:
  - "The benchmark goes beyond standalone coding tasks and targets end-to-end full-stack development."
  - "This page keeps Overall as the primary leaderboard instead of splitting every domain-specific subscore."
leaderboard_note_zh: "榜单展示论文主实验表中的 Overall。论文还提供更细的前后端子域分数，这里不单独展开。"
leaderboard_note_en: "The leaderboard shows the Overall score from the main experiments table. The paper also reports finer frontend/backend subscores, which are not expanded here."
