id: fullstack_bench
name: "FullStack Bench"
name_zh: "FullStack Bench"
name_en: "FullStack Bench"
url: "https://github.com/bytedance/FullStackBench"
paper: "https://arxiv.org/abs/2412.00535"
description_zh: "FullStack Bench 评估 LLM 在全栈开发场景中的综合编码能力。页面主榜单采用论文主结果表的 Overall。"
description_en: "FullStack Bench evaluates LLMs as full-stack coders. The displayed leaderboard uses the Overall score from the main results table."
overview_zh: |
  FullStack Bench 不再只考单点编程题，而是面向更完整的全栈开发能力。
  它覆盖基础编程、数据分析、软件工程、数学与机器学习等多个应用域。
  数据来自 16 种常用编程语言的真实世界指令和单元测试，而不是简单翻译题。
  论文同时发布了多语言执行沙箱 SandboxFusion，用来稳定评测这些任务。
  实验说明，全栈开发场景比传统代码 benchmark 更贴近真实使用，也更具挑战性。
overview_en: |
  FullStack Bench moves beyond isolated coding tasks and targets broader full-stack development ability.
  It covers domains such as basic programming, data analysis, software engineering, math, and machine learning.
  The benchmark uses real-world instructions and unit tests across 16 widely used programming languages.
  The paper also releases SandboxFusion to execute and evaluate these multilingual tasks reliably.
  Results show that full-stack evaluation is both more realistic and more challenging than traditional code benchmarks.
