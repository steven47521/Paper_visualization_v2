id: finder
name: "FINDER"
name_zh: "FINDER"
name_en: "FINDER"
url: "https://arxiv.org/abs/2512.01948"
paper: "https://arxiv.org/abs/2512.01948"
description_zh: "该工作围绕“真正有用的深度研究代理”展开评估。页面主榜单采用论文表中的 Checklist Pass Rate。"
description_en: "This work studies how close current systems are to genuinely useful deep research agents. The displayed leaderboard uses the Checklist Pass Rate reported in the paper."
overview_zh: |
  FINDER 关注的不是简单问答，而是深度研究代理能否产出真正接近分析师水平的完整报告。
  论文构建了 100 个人工设计的研究任务，并配套 419 个结构化 checklist 条目。
  这些条目覆盖报告结构、分析深度与事实支撑，用来更稳定地评价研究质量。
  基于约 1000 份主流系统生成的报告，论文还总结了 DEFT 失败分类体系。
  结果显示，当前系统的瓶颈更多在证据整合、核验与规划，而不是任务理解本身。
overview_en: |
  FINDER focuses on whether deep research agents can produce analyst-level reports rather than simple answers.
  It introduces 100 human-curated research tasks together with 419 structured checklist items.
  These checklist items standardize report structure, analytical depth, and factual grounding.
  Based on around 1,000 generated reports, the paper also proposes the DEFT failure taxonomy.
  The main finding is that current systems struggle more with evidence integration, verification, and planning than with task understanding.
