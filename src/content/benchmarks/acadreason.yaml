    name: "Average Score"
    description: "Average score value from the main ACADREASON results table."
    higher_is_better: true
    range: [0, 100]
leaderboard_note_zh: "论文主表将结果写为“解出题数 / 平均得分”；本页使用斜杠后的平均得分做主榜单。"
leaderboard_note_en: "The main table reports results as 'solved count / average score'; this page uses the average-score term after the slash."
