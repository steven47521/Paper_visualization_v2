id: cot_error_detection
name: "Long CoT Error Detection"
name_zh: "Long CoT Error Detection"
name_en: "Long CoT Error Detection"
url: "https://arxiv.org/abs/2502.19361"
paper: "https://arxiv.org/abs/2502.19361"
description_zh: "该工作评测模型在长链式推理中定位错误的能力。页面主榜单采用论文表中的 F1，并保留首错检测与任意错检测准确率。"
description_en: "This work evaluates whether models can detect errors in long chain-of-thought reasoning. This page uses F1 as the primary leaderboard and keeps first-error and any-error detection accuracy as auxiliary metrics."
overview_zh: |
  这项工作提出 DeltaBench，用不同 o1-like 模型生成的长链式思维过程来评测模型识别推理错误的能力。
  数据覆盖数学、代码和通用推理等任务，并对长 CoT 的每一步进行细粒度标注，从而把“答案是否正确”进一步拆解为“过程哪里出错”。
  论文据此系统分析长 CoT 的有效性与效率，并比较 PRM、critic model 等不同方法在过程级错误检测上的边界。
  核心结论是，长思维链并不天然可靠，现有过程监督和批判模型在真实长推理场景下仍存在明显不足。
overview_en: |
  This work introduces DeltaBench, a benchmark built from long chain-of-thought traces generated by o1-like models to evaluate whether models can detect reasoning errors inside those traces.
  It covers math, coding, and general reasoning tasks, and annotates long CoTs at the process level so evaluation can move from final-answer correctness to step-level critique.
  Using this benchmark, the paper studies both the effectiveness and efficiency of long CoTs and compares PRMs and critic models on fine-grained error detection.
  The main takeaway is that long reasoning traces are not inherently reliable, and current process supervision and critic models still struggle in realistic long-CoT settings.
