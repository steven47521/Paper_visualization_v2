id: mm_browsecomp
name: "MM-BrowseComp"
name_zh: "MM-BrowseComp"
name_en: "MM-BrowseComp"
url: "https://github.com/MMBrowseComp/MM-BrowseComp"
paper: "https://arxiv.org/abs/2508.13186"
description_zh: "MM-BrowseComp 评测多模态浏览智能体在开放网页环境中的检索、理解与行动能力。页面主榜单采用论文主表中的 Overall。"
description_en: "MM-BrowseComp evaluates multimodal browsing agents in open web environments. This page uses the Overall score from the main table."
overview_zh: "这篇工作面向需要同时理解文本、图片和视频的浏览型智能体任务。\n论文不仅考察开放式答案质量，还关注支持性答案、跨模态证据整合以及不同领域下的真实网页检索表现。\n结果表明，真正具备工具增强能力的系统与纯 VLM 之间仍有明显差距，多模态浏览依然具有很高门槛。"
overview_en: "This work targets browsing-agent tasks that require joint understanding of text, images, and videos.\nIt evaluates not only open-answer quality, but also support answers, cross-modal evidence integration, and domain-diverse web retrieval performance.\nThe results show a clear gap between genuinely tool-augmented systems and plain VLMs, highlighting the difficulty of multimodal browsing."
