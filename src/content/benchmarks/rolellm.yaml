id: rolellm
name: "RoleLLM"
name_zh: "RoleLLM"
name_en: "RoleLLM"
url: "https://github.com/InteractiveNLP-Team/RoleLLM-public"
paper: "https://arxiv.org/abs/2310.00746"
description_zh: "RoleLLM 聚焦角色扮演能力的构建、评测与增强。页面主榜单采用英文主实验表中的 avg，并保留 CUS、RAW、SPE 三项细粒度指标。"
description_en: "RoleLLM benchmarks and enhances role-playing abilities in language models. This page uses the avg score from the main English results table and keeps CUS, RAW, and SPE as finer-grained metrics."
overview_zh: |
  RoleLLM 不只提出 benchmark，也系统讨论了如何激发和增强模型的角色扮演能力。
  论文把整体流程拆成角色档案构建、角色知识抽取、RoleGPT 提示和角色条件微调四个阶段。
  基于这些环节，它构建了 RoleBench，这是一个大规模、细粒度的角色扮演数据集。
  论文进一步训练出 RoleLLaMA 和 RoleGLM，显著提升了开放模型的角色扮演能力。
  这项工作的核心价值，在于把“评测、提示、数据和训练”整合成一个完整框架。
overview_en: |
  RoleLLM goes beyond proposing a benchmark and studies how to elicit and improve role-playing ability.
  The paper organizes the pipeline into role profile construction, role-specific knowledge extraction, RoleGPT prompting, and role-conditioned tuning.
  Based on this pipeline, it builds RoleBench, a large-scale and fine-grained dataset for role-playing evaluation.
  It further trains RoleLLaMA and RoleGLM, showing clear gains for open models on role-playing tasks.
  Its main contribution is integrating evaluation, prompting, data construction, and training into one framework.
