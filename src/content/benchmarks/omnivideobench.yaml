    label_en: "Code Repository"
    url: "https://github.com/NJU-LINK/OmniVideoBench"
leaderboard_note_zh: "榜单采用 OmniVideoBench 主表中的 Avg 列。"
leaderboard_note_en: "The leaderboard uses the Avg column from the main OmniVideoBench table."
