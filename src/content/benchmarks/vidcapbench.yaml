    name: "Overall Acc"
    description: "Overall accuracy on VidCapBench-AE."
    higher_is_better: true
    range: [0, 100]
leaderboard_note_zh: "榜单采用 VidCapBench-AE 的 Overall Acc，不额外组合 Precision、Coverage 和 Conciseness。"
leaderboard_note_en: "The leaderboard uses Overall Acc on VidCapBench-AE and does not recombine Precision, Coverage, or Conciseness."
