  - "This is one of the few benchmarks on the site where lower is better."
  - "The page sorts and highlights the leaderboard with the ASR direction reversed."
leaderboard_note_zh: "主榜单使用 ASR，越低越好。为了和其他 benchmark 一致展示，页面仍保留统一榜单样式，但排序方向已反转。"
leaderboard_note_en: "The primary leaderboard uses ASR, where lower is better. To preserve a consistent site layout, the page keeps the same table style but reverses the sorting direction."
