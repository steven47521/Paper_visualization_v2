  - label_zh: "主指标"
    label_en: "Primary Metric"
    value: "ASR"
  - label_zh: "展示设置"
    label_en: "Displayed Setting"
    value: "Main ASR table"
metrics:
  - id: asr
    name: "ASR"
    description: "Attack success rate. Lower is better."
    higher_is_better: false
    range: [0, 1]
resources:
  - label_zh: "项目主页"
    label_en: "Project Page"
    url: "https://safedialbench.github.io/"
  - label_zh: "数据仓库"
    label_en: "Dataset Repository"
