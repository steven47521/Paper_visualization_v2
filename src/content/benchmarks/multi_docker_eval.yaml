id: multi_docker_eval
name: "Multi-Docker-Eval"
name_zh: "Multi-Docker-Eval"
name_en: "Multi-Docker-Eval"
url: "https://github.com/Z2sJ4t/Multi-Docker-Eval"
paper: "https://arxiv.org/abs/2512.06915"
description_zh: "Multi-Docker-Eval 关注代码智能体自动构建软件环境的能力。页面主榜单采用 SWE-Builder 框架下的 F2P。"
description_en: "Multi-Docker-Eval studies automatic environment building for software engineering agents. This page uses F2P under the SWE-Builder setting."
overview_zh: "这篇工作不再只看代码修改本身，而是把评测延伸到测试环境的自动构建。\n作者提出 Multi-Docker-Eval，用多语言、多仓库实例衡量模型能否把项目真正拉起并进入可测试状态。\n结果表明，环境搭建仍是 agentic software engineering 中的重要瓶颈，不同模型在成功率和开销上差异明显。"
overview_en: "This work extends software-engineering evaluation beyond code edits to the automatic construction of runnable environments.\nMulti-Docker-Eval measures whether models can bring diverse repositories into a test-ready state across languages and setups.\nThe results show that environment building remains a major bottleneck for agentic software engineering, with large differences in success rate and cost."
