id: hellobench
name: "HelloBench"
name_zh: "HelloBench"
name_en: "HelloBench"
url: "https://github.com/Quehry/HelloBench"
paper: "https://arxiv.org/abs/2409.16191"
description_zh: "HelloBench 面向长文本生成能力评测。页面主榜单采用论文主实验表中的 AVG S。"
description_en: "HelloBench evaluates long-form text generation. This page uses AVG S from the paper's main experiment table."
overview_zh: |
  HelloBench 关注的是长文本生成，而不是更常见的长上下文理解。
  它基于 Bloom 分类法，将长文本任务划分为开放问答、摘要、聊天、续写和启发式生成五类。
  论文同时提出 HelloEval，用更高效的人类对齐方式来评估长文质量。
  大规模实验显示，当前模型普遍存在长度上限、重复严重和质量衰减等问题。
  因而这项工作强调，长文本“能写更长”与“能写得好”需要分开评测。
overview_en: |
  HelloBench focuses on long-form generation rather than the more common long-context understanding setting.
  It organizes tasks into five categories based on Bloom's Taxonomy, including QA, summarization, chat, completion, and heuristic generation.
  The paper also proposes HelloEval as a more efficient human-aligned evaluation method for long text quality.
  Large-scale experiments show that current models face length ceilings, repetition, and clear quality degradation.
  The benchmark highlights that generating longer text and generating better long text are not the same ability.
