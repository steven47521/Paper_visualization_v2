id: if_vidcap
name: "IF-VidCap"
name_zh: "IF-VidCap"
name_en: "IF-VidCap"
url: "https://github.com/NJU-LINK/IF-VidCap"
paper: "https://arxiv.org/abs/2510.18726"
description_zh: "IF-VidCap 关注视频描述中的指令遵循能力。页面主榜单采用论文主表中的 Overall CSR。"
description_en: "IF-VidCap evaluates instruction following in video captioning. This page uses the Overall CSR from the main table."
overview_zh: "这篇工作指出视频 caption 不应只看内容覆盖，还应考察模型是否真正遵循格式、关键词和结构等显式约束。\nIF-VidCap 将规则约束与开放式约束结合起来，系统评测视频描述模型的指令执行能力。\n主结果表明，顶级闭源和强开源多模态模型在 CSR 上领先，但严格指令遵循仍然远未解决。"
overview_en: "This work argues that video captioning should evaluate not only content coverage, but also whether models truly follow explicit instructions on format, keywords, and structure.\nIF-VidCap combines rule-based and open-ended constraints to systematically assess instruction following in video captioning.\nThe main results show clear advantages for leading closed-source and strong open-source multimodal models, yet strict instruction following remains unsolved."
