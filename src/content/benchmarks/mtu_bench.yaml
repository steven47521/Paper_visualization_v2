id: mtu_bench
name: "MTU-Bench"
name_zh: "MTU-Bench"
name_en: "MTU-Bench"
url: "https://github.com/MTU-Bench-Team/MTU-Bench"
paper: "https://arxiv.org/abs/2410.11710"
description_zh: "MTU-Bench 评测多粒度工具使用能力。页面主榜单采用最具挑战性的 Multi-turn Multi-tool（M-M）设置，并同时展示其他三种粒度结果。"
description_en: "MTU-Bench evaluates tool use at multiple granularities. This page uses the most challenging Multi-turn Multi-tool (M-M) setting as the primary leaderboard and also keeps the other three settings."
overview_zh: |
  MTU-Bench 面向工具使用能力评测，并强调不同交互粒度下的能力差异。
  它覆盖单轮/多轮、单工具/多工具以及分布外任务等多种使用场景。
  与不少基准不同，论文尽量避免依赖 GPT 或人工打分，而是使用可自动计算的客观指标。
  数据由已有高质量任务转换而来，并配套提出了 MTU-Instruct 用于能力增强。
  这使它既能覆盖更丰富的工具场景，也能显著降低大规模评测成本。
overview_en: |
  MTU-Bench evaluates tool-use ability while emphasizing differences across multiple interaction granularities.
  It covers single-turn and multi-turn settings, single-tool and multi-tool settings, as well as out-of-distribution tasks.
  Unlike many prior benchmarks, it avoids GPT-based or human scoring and uses objective metrics derived from ground truth.
  The benchmark is built by transforming existing high-quality tasks and is paired with MTU-Instruct for improvement.
  This makes it both broader in coverage and cheaper to evaluate at scale.
