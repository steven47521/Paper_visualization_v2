highlights_zh:
  - "M-M 是该基准最难的组合设置，更能体现复杂工具编排能力。"
  - "页面保留四个粒度结果，方便理解模型为何在综合榜上领先或落后。"
highlights_en:
  - "M-M is the hardest setting and best reflects complex tool orchestration ability."
  - "All four granularities are kept so the page can explain why models lead or lag on the aggregate leaderboard."
leaderboard_note_zh: "主榜单使用 M-M。论文没有给出单一统一总分，因此这里选择最能代表复杂工具使用能力的一项作为主指标。"
leaderboard_note_en: "The primary leaderboard uses M-M. The paper does not report a single unified overall score, so this page chooses the most representative hard setting as the main metric."
