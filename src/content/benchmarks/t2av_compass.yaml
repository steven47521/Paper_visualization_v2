id: t2av_compass
name: "T2AV-Compass"
name_zh: "T2AV-Compass"
name_en: "T2AV-Compass"
url: "https://github.com/NJU-LINK/T2AV-Compass"
paper: "https://arxiv.org/abs/2512.21094"
description_zh: "T2AV-Compass 统一评测文本到音视频生成系统。页面主榜单采用论文主观评测表中的 Average。"
description_en: "T2AV-Compass provides unified evaluation for text-to-audio-video generation systems. This page uses the Average score from the subjective evaluation table."
overview_zh: "这篇工作面向文本到音视频生成，强调视频质量、音频质量、跨模态对齐、指令遵循和真实感的统一评测。\n作者构建了 500 条高复杂度提示，并结合客观指标与 MLLM-as-a-Judge 的主观评测框架进行评估。\n主结果显示，当前模型在视频表现之外，仍普遍受到音频真实感和精细跨模态同步的限制。"
overview_en: "This work targets text-to-audio-video generation and jointly evaluates video quality, audio quality, cross-modal alignment, instruction following, and realism.\nIt builds 500 high-complexity prompts and combines objective metrics with an MLLM-as-a-Judge subjective protocol.\nThe main results show that, beyond visual quality, current systems remain bottlenecked by audio realism and fine-grained cross-modal synchronization."
