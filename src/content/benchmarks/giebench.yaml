id: giebench
name: "GIEBench"
name_zh: "GIEBench"
name_en: "GIEBench"
url: "https://github.com/GIEBench/GIEBench"
paper: "https://arxiv.org/abs/2406.14903"
description_zh: "GIEBench 评估大模型面向群体身份的同理能力。页面主榜单采用论文 COT-Prompt 结果表中的 Overall。"
description_en: "GIEBench measures group identity-based empathy in LLMs. This page uses Overall from the COT-Prompt results table."
overview_zh: |
  GIEBench 关注的不是泛化的人类情绪，而是与群体身份相关的同理与立场理解。
  论文覆盖 11 个身份维度、97 类群体身份和 999 道选择题。
  它希望评估模型能否从性别、年龄、职业、种族等特定身份视角作答。
  实验发现，模型通常能理解不同群体的立场，但并不会稳定地平等表达同理。
  这说明多元身份价值观的对齐，仍是当前模型的重要短板。
overview_en: |
  GIEBench studies empathy tied to group identity rather than only generic human emotions.
  It covers 11 identity dimensions, 97 group identities, and 999 multiple-choice questions.
  The benchmark evaluates whether models can answer from the perspective of specific groups such as gender, age, occupation, and race.
  Experiments show that models often understand these standpoints but do not consistently express equal empathy across them.
  This highlights the need for better alignment with diverse identities and value systems.
