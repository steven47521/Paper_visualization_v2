highlights_zh:
  - "该工作把身份、立场与价值理解纳入同理评测，而不是只看一般情绪识别。"
  - "页面固定 COT-Prompt 设置，因为它最接近论文主分析。"
highlights_en:
  - "The benchmark extends empathy evaluation beyond generic emotion recognition into identity, stance, and value understanding."
  - "The page fixes the COT-Prompt setting because it is the one emphasized in the paper's main analysis."
leaderboard_note_zh: "榜单使用论文 COT-Prompt 主表中的 Overall。论文同时报告 ID-Prompt 与 Raw-Prompt，本页不混合不同提示设置。"
leaderboard_note_en: "The leaderboard uses Overall from the COT-Prompt main table. The paper also reports ID-Prompt and Raw-Prompt settings, which are not mixed here."
