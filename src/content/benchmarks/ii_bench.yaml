highlights_zh:
  - "该工作强调图像深层 implication，而不是表层目标识别。"
  - "页面采用总准确率作为主榜单，便于与同类图像理解 benchmark 对齐。"
highlights_en:
  - "The benchmark targets deep image implications rather than surface object recognition."
  - "The page uses overall accuracy as the primary leaderboard for easier alignment with related image-understanding benchmarks."
leaderboard_note_zh: "榜单采用论文主表中的 Overall Accuracy。论文还提供更细任务维度，本页不拆成多个主榜。"
leaderboard_note_en: "The leaderboard uses Overall Accuracy from the main table. The paper also provides finer task dimensions, which are not split into separate main leaderboards here."
