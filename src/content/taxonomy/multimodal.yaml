id: multimodal
name_zh: "MLLM Benchmark"
name_en: "MLLM Benchmark"
icon: "image"
color: "#0891b2"
order: 3
subcategories:
  - id: image_understanding
    name_zh: "图像理解"
    name_en: "Image Understanding"
    description_zh: "关注图像隐含义、跨文化视觉语义与图像深层理解能力。"
    description_en: "Benchmarks for image implication, cross-cultural semantics, and deep visual understanding."
    benchmarks:
      - ii_bench
      - lime
      - cii_bench
  - id: long_video_understanding
    name_zh: "长视频理解"
    name_en: "Long Video Understanding"
    description_zh: "关注长视频、多视频和图像支撑视频推理等复杂视频理解能力。"
    description_en: "Benchmarks for long-video, multi-video, and image-grounded video understanding."
    benchmarks:
      - mt_video_bench
      - scalelong
      - mvu_eval
      - iv_bench
  - id: video_captioning
    name_zh: "视频描述"
    name_en: "Video Captioning"
    description_zh: "关注视频差异描述、指令遵循式视频描述与高质量视频 caption 评测。"
    description_en: "Benchmarks for video difference captioning, instruction-following captioning, and comprehensive video caption evaluation."
    benchmarks:
      - vidic
      - if_vidcap
      - vidcapbench
  - id: omni_understanding
    name_zh: "全模态理解"
    name_en: "Omni Understanding"
    description_zh: "关注音视频联合理解、全模态指令遵循与统一全模态评测。"
    description_en: "Benchmarks for audio-visual understanding, omni instruction following, and unified omni evaluation."
    benchmarks:
      - omnibench
      - omnivideobench
      - omnicap_if
