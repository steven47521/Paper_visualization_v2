id: llm
name_zh: "LLM Benchmark"
name_en: "LLM Benchmark"
icon: "brain"
color: "#2563eb"
order: 5
subcategories:
  - id: instruction_following
    name_zh: "指令遵循"
    name_en: "Instruction Following"
    description_zh: "关注多轮对话和复杂反向指令场景下的指令遵循能力。"
    description_en: "Benchmarks for instruction following in multi-turn dialogue and inverse-instruction settings."
    benchmarks:
      - mt_bench_101
      - inverse_ifeval
  - id: long_context
    name_zh: "长上下文"
    name_en: "Long Context"
    description_zh: "关注长链推理错误检测、长文本生成和长文本奖励建模。"
    description_en: "Benchmarks for long-chain error detection, long-form generation, and long-form reward modeling."
    benchmarks:
      - cot_error_detection
      - hellobench
      - longform_rewardbench
  - id: math
    name_zh: "数学"
    name_en: "Math"
    description_zh: "关注概念级数学推理与形式化数学评测。"
    description_en: "Benchmarks for concept-wise mathematical reasoning and mathematical formalization."
    benchmarks:
      - conceptmath
      - criticlean
  - id: reasoning
    name_zh: "推理"
    name_en: "Reasoning"
    description_zh: "关注知识正交推理、动态博弈推理、表格理解与工具使用推理。"
    description_en: "Benchmarks for knowledge-orthogonal reasoning, dynamic reasoning games, table QA, and tool-use reasoning."
    benchmarks:
      - kor_bench
      - korgym
      - tablebench
      - mtu_bench
  - id: knowledge
    name_zh: "知识"
    name_en: "Knowledge"
    description_zh: "关注跨学科研究生级知识问答、中文事实性问答与 IT 运维知识能力。"
    description_en: "Benchmarks for graduate-level knowledge, Chinese factual QA, and IT operations knowledge."
    benchmarks:
      - supergpqa
      - chinese_simpleqa
      - owl
  - id: safety
    name_zh: "安全"
    name_en: "Safety"
    description_zh: "关注短事实安全、多轮对话安全与统一安全攻击评测。"
    description_en: "Benchmarks for short-form safety factuality, multi-turn dialogue safety, and unified safety evaluation."
    benchmarks:
      - chinese_safetyqa
      - safedialbench
      - usb
  - id: role_playing
    name_zh: "角色扮演"
    name_en: "Role-playing"
    description_zh: "关注角色扮演能力、角色构建与角色智能体评测。"
    description_en: "Benchmarks for role-playing ability, role construction, and role-based agents."
    benchmarks:
      - rolellm
      - roleagent
